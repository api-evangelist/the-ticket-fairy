identifiers:
  note: >-
    Two identifier styles coexist. Numeric/opaque `id` on catalog objects (event, ticket type,
    country, state) and an opaque `hash` on anything a buyer holds a link to (order hash, ticket
    hash, ticketTypeHash). Order and ticket URLs are hash-addressed, which is what makes an
    emailed order link work without authentication. No prefixed-id scheme (no `evt_`/`ord_`).

