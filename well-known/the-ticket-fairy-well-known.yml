note: >-
  NO WELL-KNOWN DOCUMENT IS SERVED. Every RFC 8615 path was probed on all four Ticket Fairy hosts
  and none returned a document. www.ticketfairy.com and www.theticketfairy.com answer a hard 404
  (146-byte text/html). manage.ticketfairy.com — the organizer dashboard — is a single-page app
  with a catch-all route: it answers HTTP 200 with the SPA's text/html shell for EVERY
  /.well-known/* path, including paths that cannot exist. Those 200s are NOT documents and are
  recorded as misses. Consequently NO WellKnown, SecurityTxt, or AgentCard pointer is emitted in
  apis.yml — the probe records an absence, and an absence must not be published as a presence.
