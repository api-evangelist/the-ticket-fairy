note: >-
  The Ticket Fairy publishes no developer portal or SDK index page, so every package below was
  found by walking the company's own GitHub organization (github.com/theticketfairy) and then
  confirming first-party ownership against npm registry metadata. Both npm packages are published
  by the npm user `theticketfairy`, which is what establishes them as first-party. npm, PyPI,
  RubyGems, crates.io, Packagist, NuGet, Maven Central and pkg.go.dev were all checked; only npm
  carries Ticket Fairy client libraries.
