note: >-
  Ticket Fairy sells no subscription plans. There is no seat, tier, or monthly SKU — the product is
  free to adopt and monetized entirely as a per-ticket fee that steps down as the ticket price
  rises, charged to the ticket buyer at checkout by default. Captured as a single fee schedule
  rather than as plans, because that is what the company actually publishes. Read from the page's
  own Markdown twin (the site serves `.md` for any page), so these figures are the provider's
  published values verbatim.
