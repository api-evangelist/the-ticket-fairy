apis:
- name: The Ticket Fairy REST API
  description: >-
    The REST API behind Ticket Fairy's ticket-buying experience: events, ticket types, time slots,
    add-ons, promo codes, cart, checkout, payment, orders, issued tickets and face-value resale,
    plus OAuth token issuance, customer profiles and country/state reference data. A public read
    slice answers anonymously — /api/countries/list and, on the theticketfairy.com host,
    /api/public/filtered-events, which is the endpoint the company's own WordPress plugin calls.
    The rest requires an OAuth Bearer token or the platform's parallel guest token. The API is
    real, live and idempotency-aware, but it is entirely undocumented: there is no reference, no
    OpenAPI, and robots.txt disallows /api/*. Everything profiled here was read from the company's
    own first-party npm checkout SDKs and from live anonymous probes.
  humanURL: https://www.ticketfairy.com/event-ticketing/embedded-ticket-checkout
  baseURL: https://www.ticketfairy.com/api
